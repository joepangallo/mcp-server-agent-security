name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC, tokenless) requires npm >= 11.5.1
      - run: npm install -g npm@12.0.1

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test
      - run: npm run lint:package
      - run: npm run audit:prod

      # No NODE_AUTH_TOKEN: auth comes from npm trusted publishing (GitHub OIDC).
      # The npm package settings must list this repo + workflow as a trusted publisher.
      - run: npm publish --provenance --access public
